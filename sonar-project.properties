sonar.projectKey=cascade
sonar.projectName=Cascade
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/*.d.ts
sonar.coverage.exclusions=src/cli.ts,src/**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Effect pipelines intentionally nest generators, stream callbacks, and
# resource finalizers past four levels (gen → map/tap → gen → …). S2004
# flags that nesting as CRITICAL without a product defect. Keep the rule
# ignored until a real readability refactor is scheduled deliberately.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2004
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
