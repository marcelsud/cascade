# Grading configuration for marcelsud/cascade.
# This is the project configuration artifact required by grading-methodology
# §4.7. Spec: https://github.com/marcelsud/specs/blob/main/grading-methodology.md
# Changing thresholds, exclusions, objectives, topics, or mode is a policy
# change and MUST be its own reviewed PR (spec §10.1, §4.8), never part of a
# feature PR.
rubric_version: 1.1.0
mode: report-only

# Model authority is earned on private, labeled cases. The calibration tool
# reports fixed-benchmark confidence only; it never turns model self-confidence
# into evidence. Keep the case data outside the repository so audit agents
# cannot read the labels they are being tested against.
calibration:
  minimum_bug_cases: 60
  minimum_clean_cases: 60
  finding_precision_lcb: 0.95
  no_finding_sensitivity_lcb: 0.80
  clean_specificity_lcb: 0.95
  max_abstention_rate: 0.20

# Objective registry (spec §4.8), cited by IE-7. Issues cite an ID from this
# list. Identifiers are stable and are never reused for a different guarantee,
# because stored grade records cite them. A recorded administrative request may
# satisfy IE-7 without an objective, but only via the D path (issue grade D,
# spec §5.1).
objectives:
  REL-1: >-
    Delivery guarantees: documented reliable/at-least-once delivery paths hold
    across the full pipeline boundary (input -> processors -> outputs/DLQ).
  REL-2: >-
    Documented component contracts behave as documented (timeouts, retries,
    template evaluation, error classification).
  TEST-1: >-
    Release gates and test tooling are trustworthy: runnable from a clean
    checkout and free of false positives.

# Topic registry for the continuous audit loop.
# Spec: https://github.com/marcelsud/specs/blob/main/continuous-audit.md §5
# One topic is audited per run, selected by weighted staleness x churn. Every
# objective listed here MUST exist in the registry above; a topic citing an
# absent objective is not selectable, because its findings would fail IE-7
# only after the reproduction has already been paid for.
topics:
  - id: input-acquisition-lifecycle
    paths: [src/inputs/]
    objectives: [REL-1, REL-2]
  - id: input-backpressure-and-overflow
    paths: [src/inputs/input-queue.ts]
    objectives: [REL-1]
  - id: output-delivery-and-retry
    paths: [src/outputs/]
    objectives: [REL-1, REL-2]
  - id: dlq-and-failure-routing
    paths: [src/core/dlq.ts, src/core/error-collector.ts, src/core/pipeline.ts]
    objectives: [REL-1]
  - id: shutdown-and-drain
    paths: [src/core/pipeline.ts, src/inputs/]
    objectives: [REL-1]
  - id: expression-evaluation
    paths:
      - src/processors/mapping-processor.ts
      - src/processors/filter-processor.ts
      - src/processors/switch-processor.ts
    objectives: [REL-2]
  - id: processor-contracts
    paths: [src/processors/]
    objectives: [REL-2]
  - id: config-schema-and-builder
    paths:
      - src/core/config-schema.ts
      - src/core/config-loader.ts
      - src/core/pipeline-builder.ts
      - src/core/component-registry.ts
    objectives: [REL-2]
  - id: error-classification
    paths: [src/core/errors.ts, src/core/validation.ts]
    objectives: [REL-2]
  - id: metrics-and-observability
    paths: [src/core/metrics.ts]
    objectives: [REL-2]
  - id: redis-connection-lifecycle
    paths:
      - src/core/redis-client.ts
      - src/core/redis-client-options.ts
      - src/core/redis-url.ts
      - src/inputs/redis-reconnect.ts
    objectives: [REL-1, REL-2]
  - id: cli-surface
    paths:
      - src/cli.ts
      - src/cli-args.ts
      - src/cli-config.ts
      - src/cli-dispatch.ts
      - src/cli-errors.ts
      - src/cli-metrics.ts
    objectives: [REL-2]
  - id: gate-trustworthiness
    paths: [.github/grading/, .github/workflows/]
    objectives: [TEST-1]
  - id: test-utilities
    paths: [src/testing/]
    objectives: [TEST-1]

# RT-3 is intentionally unused in rubric 1.1.0. Behavioral proof is a reviewer
# duty under SG-5, not a machine ratchet.
ratchets:
  RT-1:
    check: "npm run lint && npm run build"
    enforcement: ci-blocking
  RT-2:
    check: "node .github/grading/checks.mjs test-integrity --base $BASE_SHA && npm run test:unit"
    enforcement: ci-blocking
    # Paths removed from the blocking unit collection must be listed here in a
    # dedicated policy PR. Unlisted reductions fail RT-2 closed.
    approved_test_removals: []
    # RT-2 cannot compare Vitest collections across a dependency change without
    # re-installing the merge base, so it fails closed. To land one, add the
    # exact transition fingerprint printed by the failure here in a policy-only
    # PR, then rebase the dependency change onto it.
    approved_dependency_transitions:
      # jsonata 2.1.0 -> 2.2.2, removing GHSA-86vw-mfpg-wwv9 (issue #112).
      - "4d44cb0c32b0c5e6b4a284ef6f3bd276c6477054406b55b9ad5945073e77ab25:cc8c817e5cc0ae14af65ae09d7fa728e70ee4743a9ffc55d892ff1bdfc2ef08f"

  RT-4:
    check: "npm run test:coverage; node .github/grading/checks.mjs coverage --report <output> --config .github/grading/config.yml"
    enforcement: report-only
    baseline_commit: 60d85c8
    baseline_total_lines_pct: 67.05
  RT-5:
    check: "node .github/grading/checks.mjs complexity --base $BASE_SHA --config .github/grading/config.yml"
    enforcement: report-only
    max_cyclomatic_complexity: 20
  RT-6:
    check: "node .github/grading/checks.mjs duplicates --base $BASE_SHA --config .github/grading/config.yml"
    enforcement: report-only
    minimum_tokens: 60
  RT-7:
    check: "New runtime dependency requires capability/ownership/security justification in the PR body"
    enforcement: reviewer
  RT-8:
    check: "Public config/API changes require schema, docs, and behavioral tests"
    enforcement: reviewer

baseline:
  commit: 60d85c8
  unit_tests_passing: 662
  lint: clean
  runtime_focused_or_skipped_tests: 0
  conditional_test_guards:
    - "tests/unit/inputs/file-input.test.ts:224 skipIf"
    - "tests/unit/outputs/file-output.test.ts:308 runIf"
